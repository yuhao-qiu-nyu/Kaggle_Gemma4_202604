<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASL AI Practice Classroom</title>
<style>
  :root {
    --bg: #0b0e14;
    --card: #151921;
    --border: #232936;
    --accent: #6c5ce7;
    --accent-glow: rgba(108, 92, 231, 0.3);
    --text: #f0f2f5;
    --text-dim: #94a3b8;
    --success: #00b894;
    --warning: #fdcb6e;
    --danger: #e17055;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow-x: hidden;
  }

  /* Layout */
  .app-grid {
    display: grid;
    grid-template-columns: 280px 1fr;
    height: 100vh;
  }

  /* Sidebar */
  aside {
    background: var(--card);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 24px;
  }
  .logo {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 32px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .course-list {
    flex: 1;
    overflow-y: auto;
  }
  .course-item {
    padding: 12px 16px;
    border-radius: 10px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: all .2s;
    border: 1px solid transparent;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .course-item:hover { background: rgba(255,255,255,0.05); }
  .course-item.active {
    background: var(--accent);
    color: white;
    box-shadow: 0 4px 15px var(--accent-glow);
  }
  .course-item .label { font-weight: 500; text-transform: capitalize; }
  .course-item .status { font-size: 10px; opacity: 0.7; }

  /* Main Content */
  main {
    padding: 32px;
    overflow-y: auto;
  }
  .stage-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }
  .panel-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-dim);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Video Windows */
  .video-container {
    background: #000;
    border-radius: var(--radius);
    aspect-ratio: 16/9;
    overflow: hidden;
    border: 1px solid var(--border);
    position: relative;
  }
  #refVideo { width: 100%; height: 100%; border: none; }
  #webcamVideo { width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }

  /* Controls */
  .controls {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-top: 16px;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-primary { background: var(--accent); color: white; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.1); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

  /* Results Card */
  .results-card {
    background: var(--card);
    border-radius: var(--radius);
    padding: 32px;
    border: 1px solid var(--border);
    display: none;
  }
  .results-card.active { display: block; animation: slideUp 0.4s ease-out; }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .feedback-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 24px;
  }
  .score-info h2 { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
  .score-info .target-sign { color: var(--accent); }
  
  .judgment {
    padding: 8px 16px;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
  }
  .pass { background: rgba(0, 184, 148, 0.15); color: var(--success); }
  .fail { background: rgba(225, 112, 85, 0.15); color: var(--danger); }

  .coach-comment {
    background: rgba(255,255,255,0.03);
    padding: 20px;
    border-radius: 12px;
    line-height: 1.7;
    font-size: 15px;
    white-space: pre-wrap;
  }

  /* Recording Indicator */
  .rec-indicator {
    position: absolute;
    top: 16px;
    right: 16px;
    background: rgba(225, 112, 85, 0.8);
    color: white;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 700;
    display: none;
    align-items: center;
    gap: 6px;
  }
  .rec-indicator.active { display: flex; }
  .dot { width: 8px; height: 8px; background: white; border-radius: 50%; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* Loading Overlay */
  .loader-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(11, 14, 20, 0.8);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
  }
  .spinner {
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="app-grid">
  <aside>
    <div class="logo">
      <span>🤟</span> ASL Classroom
    </div>
    <div class="panel-title">Choose a word to practice</div>
    <div class="course-list" id="courseList">
      <!-- Generated by JS -->
    </div>
  </aside>

  <main>
    <div class="stage-grid">
      <div class="stage-item">
        <div class="panel-title">🎥 1. Reference video</div>
        <div class="video-container">
          <iframe id="refVideo" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
      </div>
      <div class="stage-item">
        <div class="panel-title">📹 2. Record your sign</div>
        <div class="video-container">
          <video id="webcamVideo" autoplay muted playsinline></video>
          <div class="rec-indicator" id="recIndicator">
            <div class="dot"></div> REC
          </div>
        </div>
        <p id="recordStatus" style="text-align:center;margin-top:8px;font-size:13px;color:var(--text-dim)"></p>
        <p id="envWarning" style="text-align:center;margin-top:8px;font-size:13px;color:var(--danger);display:none;"></p>
        <div class="controls">
          <button class="btn btn-outline" id="btnStartCam">Open camera</button>
          <button class="btn btn-danger" id="btnRecord" style="display:none">Start recording</button>
          <button class="btn btn-primary" id="btnSubmit" disabled>Submit for analysis</button>
        </div>
      </div>
    </div>

    <div class="results-card" id="resultsCard">
      <div class="feedback-header">
        <div class="score-info">
          <h2 id="resStatus">Analyzing...</h2>
          <p>Target word: <span class="target-sign" id="targetLabel">CAT</span></p>
        </div>
        <div class="judgment" id="judgmentBadge">MATCH</div>
      </div>
      <div class="coach-comment" id="coachFeedback"></div>
      <div style="margin-top:24px">
        <button class="btn btn-outline" onclick="resetUI()">Try again</button>
      </div>
    </div>
  </main>
</div>

<div class="loader-overlay" id="loader">
  <div class="spinner"></div>
  <p>Uploading and analyzing your sign with AI...</p>
</div>

<script>
// --- Global Elements (Fixed Initialization Order) ---
const btnStartCam = document.getElementById('btnStartCam');
const btnRecord = document.getElementById('btnRecord');
const btnSubmit = document.getElementById('btnSubmit');
const webcamVideo = document.getElementById('webcamVideo');
const recIndicator = document.getElementById('recIndicator');
const listEl = document.getElementById('courseList');
const loader = document.getElementById('loader');

const COURSES = [
  { word: 'apple', id: '3wIiujOP6Ag' },
  { word: 'book', id: 'XjWSfh50kAU' },
  { word: 'bye', id: '4e14uNAn2Ao' },
  { word: 'cat', id: 'LzbVyRp_8Bg' },
  { word: 'dad', id: '1Vllc4F5ic0' },
  { word: 'dog', id: 'IbpJtH_QssM' },
  { word: 'drink', id: 'LqJM7wcUixQ' },
  { word: 'happy', id: 'ZXHHO_DY6_A' },
  { word: 'hello', id: 'FVjpLa8GqeM' },
  { word: 'home', id: 'WSHD1XX7kWk' },
  { word: 'hot', id: '00cPyUsrC6M' },
  { word: 'hungry', id: 'yPb2a_UcRr4' },
  { word: 'look', id: 'JytzcBQp8d4' },
  { word: 'milk', id: 'quk_XoRtZWk' },
  { word: 'mom', id: 'DHl2-NT3mIM' },
  { word: 'no', id: 'QJXKaOSyl4o' },
  { word: 'please', id: 'rnb9FxPO7is' },
  { word: 'sad', id: 'zfkQYQhrZ6Q' },
  { word: 'sleep', id: 'dXEqaWSEztY' },
  { word: 'thankyou', id: 'IvRwNLNR4_w' },
  { word: 'water', id: 'QDlDLqvdApI' },
  { word: 'where', id: 'qxh-EVaK6kY' },
  { word: 'who', id: 'wKl26BsEAoc' },
  { word: 'why', id: 'K0yp2v6Atxs' },
  { word: 'yes', id: '0usayvOXzHo' }
];

let activeCourse = COURSES[0];
let mediaStream = null;
let mediaRecorder = null;
let recordedChunks = [];
let recordedBlob = null;
let isRecording = false;

// --- Init Course List ---
COURSES.forEach((c, index) => {
  const item = document.createElement('div');
  item.className = `course-item ${index === 0 ? 'active' : ''}`;
  item.innerHTML = `<span class="label">${c.word}</span><span class="status">Not tried</span>`;
  item.onclick = () => selectCourse(c, item);
  listEl.appendChild(item);
});

function selectCourse(course, element) {
  activeCourse = course;
  document.querySelectorAll('.course-item').forEach(i => i.classList.remove('active'));
  element.classList.add('active');
  
  document.getElementById('refVideo').src = `https://www.youtube.com/embed/${course.id}?autoplay=0&mute=1`;
  document.getElementById('targetLabel').textContent = course.word.toUpperCase();
  resetUI();
}

if (listEl.firstElementChild) {
  selectCourse(COURSES[0], listEl.firstElementChild);
}

// --- Camera & Recording ---
btnStartCam.onclick = async () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const msg = 'Camera is not available in this browser. Use localhost or HTTPS.';
    console.error(msg);
    alert(msg);
    return;
  }
  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({ 
      video: { width: { ideal: 1280 }, height: { ideal: 720 } }, 
      audio: false 
    });
    webcamVideo.srcObject = mediaStream;
    btnStartCam.style.display = 'none';
    btnRecord.style.display = 'flex';
    document.getElementById('envWarning').style.display = 'none';
  } catch (err) {
    console.error('Camera access error:', err);
    alert('Could not access camera: ' + err.message + '\nPlease check camera permissions.');
  }
};

window.addEventListener('load', () => {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    const warnEl = document.getElementById('envWarning');
    warnEl.textContent = '⚠️ Camera not supported. Open this page via http://localhost:8001';
    warnEl.style.display = 'block';
  }
});

btnRecord.onclick = () => {
  if (!isRecording) {
    startRecording();
  } else {
    stopRecording();
  }
};

function startRecording() {
  recordedChunks = [];
  let options = { mimeType: 'video/webm;codecs=vp8' };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm' };
  }
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: '' };
  }
  
  try {
    mediaRecorder = new MediaRecorder(mediaStream, options);
  } catch (e) {
    console.error('MediaRecorder creation failed:', e);
    alert('Could not start recording. Try refreshing the page.');
    return;
  }
  
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
  mediaRecorder.onstop = () => {
    recordedBlob = new Blob(recordedChunks, { type: 'video/webm' });
    btnSubmit.disabled = false;
    document.getElementById('recordStatus').textContent = 'Recording ready — click Submit for analysis';
  };
  
  mediaRecorder.start();
  isRecording = true;
  btnRecord.textContent = 'Stop recording';
  btnRecord.classList.replace('btn-danger', 'btn-outline');
  recIndicator.classList.add('active');
  document.getElementById('recordStatus').textContent = 'Recording…';
}

function stopRecording() {
  mediaRecorder.stop();
  isRecording = false;
  btnRecord.textContent = 'Record again';
  btnRecord.classList.replace('btn-outline', 'btn-danger');
  recIndicator.classList.remove('active');
}

// --- Submit & Analysis ---
btnSubmit.onclick = async () => {
  if (!recordedBlob) return;
  
  loader.style.display = 'flex';
  
  const formData = new FormData();
  formData.append('video', recordedBlob, 'capture.webm');
  formData.append('user_goal', `Practice word: ${activeCourse.word}`);
  formData.append('target_sign', activeCourse.word);
  formData.append('topk', '5');

  try {
    const response = await fetch('/coach_video', {
      method: 'POST',
      body: formData
    });
    const result = await response.json();
    if (!response.ok) {
      const detail = result.detail || JSON.stringify(result);
      throw new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    }
    showResults(result);
    const activeItem = document.querySelector('.course-item.active .status');
    if (activeItem) {
      const predicted = result.predicted_label.toLowerCase();
      activeItem.textContent = predicted === activeCourse.word.toLowerCase() ? 'Passed' : 'Try again';
    }
  } catch (err) {
    alert('Submission failed: ' + err.message);
  } finally {
    loader.style.display = 'none';
  }
};

function showResults(data) {
  const card = document.getElementById('resultsCard');
  const statusH2 = document.getElementById('resStatus');
  const badge = document.getElementById('judgmentBadge');
  const feedback = document.getElementById('coachFeedback');
  
  card.classList.add('active');
  
  const predicted = data.predicted_label.toLowerCase();
  const target = activeCourse.word.toLowerCase();
  const isMatch = predicted === target;
  
  statusH2.textContent = isMatch ? 'Sign matched! 🎉' : 'Sign did not match 😅';
  statusH2.style.color = isMatch ? 'var(--success)' : 'var(--danger)';
  
  badge.textContent = isMatch ? 'PERFECT' : 'TRY AGAIN';
  badge.className = `judgment ${isMatch ? 'pass' : 'fail'}`;
  
  feedback.textContent = data.coach_feedback;
  card.scrollIntoView({ behavior: 'smooth' });
}

function resetUI() {
  const card = document.getElementById('resultsCard');
  if (card) card.classList.remove('active');
  if (btnSubmit) btnSubmit.disabled = true;
  recordedBlob = null;
  document.getElementById('recordStatus').textContent = '';
  if (btnRecord && btnRecord.style.display !== 'none') {
    btnRecord.textContent = 'Start recording';
  }
}
</script>
</body>
</html>
